<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100% Logique — Maître du Jeu</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --accent: #f0c040;
      --accent2: #e05a2b;
      --text: #f0ede8;
      --muted: #6b6878;
      --success: #4ade80;
      --danger: #f87171;
      --border: rgba(240,192,64,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(240,192,64,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,192,64,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .logo span { color: var(--accent2); }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .room-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      letter-spacing: 12px;
      color: var(--accent);
      text-align: center;
      line-height: 1;
      margin: 12px 0;
      text-shadow: 0 0 40px rgba(240,192,64,0.3);
      transition: all 0.3s;
    }

    .room-code.empty { color: var(--muted); font-size: 40px; letter-spacing: 4px; }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 8px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 4px;
    }

    .btn-primary { background: var(--accent); color: #0a0a0f; }
    .btn-primary:hover:not(:disabled) { background: #f5d060; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .players-list { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

    .player-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .player-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .empty-state {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      display: none;
    }

    .question-card.visible { display: block; animation: fadeUp 0.4s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .round-badge {
      display: inline-block;
      background: var(--accent2);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .question-text {
      font-size: 22px;
      font-weight: 300;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .timer-bar-wrap {
      background: var(--surface2);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .timer-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 1s linear, background 1s;
    }

    .timer-bar.urgent { background: var(--danger); }

    .timer-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .result-box {
      background: var(--surface2);
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 12px;
      display: none;
    }

    .result-box.visible { display: block; animation: fadeUp 0.3s ease; }

    .correct-answer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--success);
      letter-spacing: 2px;
    }

    .explanation {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.6;
    }

    .answered-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .answered-chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(74,222,128,0.15);
      color: var(--success);
      border: 1px solid rgba(74,222,128,0.3);
      animation: pop 0.2s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .logs {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .logs-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .log-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry {
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: slideIn 0.2s ease;
    }

    .log-entry .ts { color: var(--accent2); margin-right: 8px; }
    .log-entry.info { color: var(--text); }
    .log-entry.success { color: var(--success); }
    .log-entry.warn { color: var(--accent); }
    .log-entry.error { color: var(--danger); }

    .gameover {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .gameover.visible { display: block; animation: fadeUp 0.5s ease; }

    .gameover-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      letter-spacing: 4px;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .podium {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto 32px;
    }

    .podium-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px 20px;
    }

    .podium-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--muted);
      width: 30px;
    }

    .podium-entry:first-child .podium-rank { color: var(--accent); }
    .podium-pseudo { font-weight: 500; flex: 1; text-align: left; margin-left: 12px; }

    .podium-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--accent);
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .room-code { font-size: 52px; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">100%<span>LOGIQUE</span> — MAÎTRE DU JEU</div>
    <div class="status-dot">
      <div class="dot" id="dot"></div>
      <span id="status-text">Déconnecté</span>
    </div>
  </header>

  <!-- Setup -->
  <div id="setup-panel">
    <div class="grid">

      <div class="card">
        <div class="card-title">Créer une room</div>
        <div class="field">
          <label>Pseudo hôte</label>
          <input type="text" id="host-pseudo" placeholder="Ex: Cyril" value="Hôte"/>
        </div>
        <div class="field">
          <label>Thème</label>
          <select id="theme-select">
            <option value="">Tous les thèmes</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btn-create">Créer la room</button>
      </div>

      <div class="card" style="text-align:center">
        <div class="card-title">Code de la room</div>
        <div class="room-code empty" id="room-code">----</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Partagez ce code aux joueurs</p>
        <button class="btn btn-primary" id="btn-start" disabled>Lancer la partie</button>
      </div>

    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="card-title">Joueurs connectés</div>
      <div class="players-list" id="players-list">
        <div class="empty-state">En attente de joueurs...</div>
      </div>
    </div>
  </div>

  <!-- Question en cours -->
  <div class="question-card" id="question-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <span class="round-badge" id="round-badge">ROUND 1/10</span>
      <span class="timer-label" id="timer-label">30</span>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>
    <div class="question-text" id="question-text"></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Joueurs ayant répondu :</div>
    <div class="answered-row" id="answered-row"></div>
    <div class="result-box" id="result-box">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Bonne réponse</div>
      <div class="correct-answer" id="correct-answer"></div>
      <div class="explanation" id="explanation"></div>
    </div>
  </div>

  <!-- Classement live -->
  <div class="card" id="scoreboard-card" style="display:none;margin-bottom:20px">
    <div class="card-title">Classement</div>
    <div class="players-list" id="scoreboard-list"></div>
  </div>

  <!-- Game over -->
  <div class="gameover" id="gameover">
    <div class="gameover-title">Partie terminée !</div>
    <div class="podium" id="podium"></div>
    <button class="btn btn-primary" style="max-width:300px;margin:0 auto" onclick="location.reload()">
      Nouvelle partie
    </button>
  </div>

  <!-- Logs -->
  <div class="logs">
    <div class="logs-title">Journal des événements</div>
    <div class="log-list" id="log-list"></div>
  </div>

</div>

<script>
  const HUB_URL = 'http://localhost:5217/gamehub';
  const API_URL = 'http://localhost:5217/api';

  let connection = null;
  let roomCode = null;
  let players = {};
  let timerInterval = null;
  let timerSeconds = 30;
  let selectedTheme = null;
  let gameStarted = false;

  const $ = id => document.getElementById(id);

  // ── Logs ──────────────────────────────────────────────────
  function log(msg, type = '') {
    const list = $('log-list');
    const ts = new Date().toLocaleTimeString('fr-FR');
    const el = document.createElement('div');
    el.className = `log-entry ${type}`;
    el.innerHTML = `<span class="ts">${ts}</span>${msg}`;
    list.prepend(el);
    if (list.children.length > 50) list.lastChild.remove();
  }

  // ── Réactivation des boutons après une erreur ─────────────
  function resetButtons() {
    if (gameStarted) return;
    if (!roomCode) {
      $('btn-create').disabled = false;
    } else {
      $('btn-start').disabled = false;
    }
  }

  // ── Chargement des thèmes ─────────────────────────────────
  async function loadThemes() {
    try {
      const res = await fetch(`${API_URL}/question/themes`);
      const themes = await res.json();
      const sel = $('theme-select');
      themes.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t.replace(/_/g, ' ');
        sel.appendChild(opt);
      });
      log(`${themes.length} thème(s) chargé(s)`, 'info');
    } catch (e) {
      log('Impossible de charger les thèmes — le serveur est-il démarré ?', 'warn');
    }
  }

  // ── Connexion SignalR ─────────────────────────────────────
  async function connect() {
    connection = new signalR.HubConnectionBuilder()
      .withUrl(HUB_URL)
      .withAutomaticReconnect()
      .build();

    connection.on('RoomCreated', data => {
      roomCode = data.roomCode;
      const el = $('room-code');
      el.textContent = roomCode;
      el.classList.remove('empty');
      $('btn-start').disabled = false;
      log(`Room créée : ${roomCode}`, 'success');
    });

    connection.on('PlayerJoined', pseudo => {
      players[pseudo] = 0;
      renderPlayers();
      log(`${pseudo} a rejoint la room`, 'success');
    });

    connection.on('PlayerLeft', pseudo => {
      delete players[pseudo];
      renderPlayers();
      log(`${pseudo} a quitté la room`, 'warn');
    });

    connection.on('GameStarted', data => {
      gameStarted = true;
      $('setup-panel').style.display = 'none';
      $('scoreboard-card').style.display = 'block';
      log(`Partie lancée — ${data.totalRounds} questions (${data.theme})`, 'success');
    });

    connection.on('NewQuestion', data => {
      showQuestion(data);
    });

    connection.on('PlayerAnswered', pseudo => {
      const row = $('answered-row');
      const chip = document.createElement('div');
      chip.className = 'answered-chip';
      chip.textContent = pseudo;
      row.appendChild(chip);
    });

    connection.on('RoundResult', data => {
      clearTimer();
      showResult(data);
      data.playerResults.forEach(p => { players[p.pseudo] = p.score; });
      renderScoreboard(data.playerResults);
    });

    connection.on('GameOver', finalScores => {
      clearTimer();
      $('question-card').classList.remove('visible');
      $('scoreboard-card').style.display = 'none';
      showGameOver(finalScores);
      log('Partie terminée !', 'success');
    });

    connection.on('HostLeft', msg => {
      gameStarted = false;
      log(msg, 'warn');
    });

    // ── Erreur — réactive toujours les boutons ────────────
    connection.on('Error', msg => {
      log(`Erreur : ${msg}`, 'error');
      resetButtons();
    });

    connection.onreconnecting(() => {
      $('dot').className = 'dot';
      $('status-text').textContent = 'Reconnexion...';
      log('Reconnexion en cours...', 'warn');
    });

    connection.onreconnected(() => {
      $('dot').className = 'dot connected';
      $('status-text').textContent = 'Connecté';
      log('Reconnecté', 'success');
    });

    connection.onclose(() => {
      $('dot').className = 'dot';
      $('status-text').textContent = 'Déconnecté';
      log('Connexion fermée');
    });

    try {
      await connection.start();
      $('dot').className = 'dot connected';
      $('status-text').textContent = 'Connecté';
      log('Connecté au serveur', 'success');
    } catch (e) {
      log(`Connexion impossible : ${e.message}`, 'error');
    }
  }

  // ── UI ────────────────────────────────────────────────────

  function renderPlayers() {
    const list = $('players-list');
    const entries = Object.entries(players);
    if (entries.length === 0) {
      list.innerHTML = '<div class="empty-state">En attente de joueurs...</div>';
      return;
    }
    list.innerHTML = entries.map(([pseudo]) => `
      <div class="player-chip">
        <span>${pseudo}</span>
        <span class="player-score">0</span>
      </div>
    `).join('');
  }

  function renderScoreboard(results) {
    $('scoreboard-list').innerHTML = [...results]
      .sort((a, b) => b.score - a.score)
      .map((p, i) => `
        <div class="player-chip">
          <span style="color:var(--muted);margin-right:10px">#${i + 1}</span>
          <span style="flex:1">${p.pseudo}</span>
          ${p.isCorrect
            ? '<span style="color:var(--success);font-size:12px">✓ +100</span>'
            : '<span style="color:var(--danger);font-size:12px">✗</span>'}
          <span class="player-score">${p.score}</span>
        </div>
      `).join('');
  }

  function showQuestion(data) {
    $('round-badge').textContent = `ROUND ${data.roundNumber}/${data.totalRounds}`;
    $('question-text').textContent = data.questionText;
    $('answered-row').innerHTML = '';
    $('result-box').classList.remove('visible');
    $('question-card').classList.add('visible');
    startTimer(data.durationSeconds);
    log(`Question ${data.roundNumber} affichée`, 'info');
  }

  function showResult(data) {
    $('correct-answer').textContent = data.correctAnswer;
    $('explanation').textContent = data.explanation;
    $('result-box').classList.add('visible');
    log(`Bonne réponse : ${data.correctAnswer}`, 'success');
  }

  function showGameOver(scores) {
    $('podium').innerHTML = [...scores]
      .sort((a, b) => b.score - a.score)
      .map((p, i) => `
        <div class="podium-entry">
          <span class="podium-rank">#${i + 1}</span>
          <span class="podium-pseudo">${p.pseudo}</span>
          <span class="podium-score">${p.score} pts</span>
        </div>
      `).join('');
    $('gameover').classList.add('visible');
  }

  // ── Timer ─────────────────────────────────────────────────

  function startTimer(seconds) {
    clearTimer();
    timerSeconds = seconds;
    const bar = $('timer-bar');
    bar.style.width = '100%';
    bar.classList.remove('urgent');
    $('timer-label').textContent = seconds;

    timerInterval = setInterval(() => {
      timerSeconds--;
      $('timer-label').textContent = timerSeconds;
      const pct = (timerSeconds / seconds) * 100;
      bar.style.width = pct + '%';
      if (timerSeconds <= 5) bar.classList.add('urgent');
      if (timerSeconds <= 0) clearTimer();
    }, 1000);
  }

  function clearTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  // ── Actions ───────────────────────────────────────────────

  $('btn-create').addEventListener('click', async () => {
    const pseudo = $('host-pseudo').value.trim() || 'Hôte';
    selectedTheme = $('theme-select').value || null;

    if (!connection || connection.state !== signalR.HubConnectionState.Connected) {
      log('Non connecté au serveur', 'warn');
      return;
    }

    $('btn-create').disabled = true;
    await connection.invoke('CreateRoom', pseudo);
  });

  $('btn-start').addEventListener('click', async () => {
    if (!roomCode) return;
    $('btn-start').disabled = true;
    log('Démarrage de la partie...', 'info');
    await connection.invoke('StartGame', roomCode, selectedTheme);
  });

  // ── Init ──────────────────────────────────────────────────
  loadThemes();
  connect();
</script>
</body>
</html>

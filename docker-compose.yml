version: '3.8'

services:
  quizz-backend:
    build: .
    container_name: quizz-backend
    ports:
      - "5000:5000"
    volumes:
      # Persiste la base SQLite et les questions hors du conteneur
      - ./data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped
services:
  quizz-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quizz-backend
    ports:
      - "5000:5000"
    volumes:
      # La base SQLite est persistée en dehors du conteneur
      - quizz-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

volumes:
  quizz-data: